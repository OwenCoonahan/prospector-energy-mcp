[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prospector-energy-mcp"
version = "0.4.1"
description = "MCP server for Prospector Labs Energy Data API — interconnection queues, tax credits, developer intelligence, and deal sourcing. Supports agent payments via MPP."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Prospector Labs" }]
dependencies = [
    # Upper bound is load-bearing, not caution. mcp 2.0.0 removed
    # mcp.server.fastmcp, so an unbounded ">=1.0.0" resolves to 2.x on a fresh
    # install and the server dies at import with ModuleNotFoundError before it
    # serves a single tool. That is what shipped in 0.4.0. Do not relax this
    # without porting server.py off mcp.server.fastmcp first.
    "mcp>=1.0.0,<2",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
payments = [
    "pympp[tempo,mcp]>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/prospector_energy"]

[project.scripts]
prospector-energy-mcp = "prospector_energy.server:main"
